name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Opt into Node.js 24 for JS actions ahead of the June 2026 default switch.
# https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.9.37'

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
          use-public-rspm: true

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-deps-${{ hashFiles('.github/workflows/publish.yml') }}
          restore-keys: ${{ runner.os }}-r-deps-

      - name: Install R deps
        run: |
          install.packages(c(
            "tidyverse", "DT", "gt", "knitr", "rmarkdown", "data.table",
            "downlit", "xml2"
          ), repos = "https://packagemanager.posit.co/cran/__linux__/jammy/latest")
        shell: Rscript {0}

      - name: Cache Quarto freeze
        uses: actions/cache@v4
        with:
          path: _freeze
          key: ${{ runner.os }}-freeze-${{ hashFiles('**/*.qmd') }}
          restore-keys: ${{ runner.os }}-freeze-

      - name: Render site
        run: quarto render

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          publish_branch: gh-pages
          force_orphan: true
