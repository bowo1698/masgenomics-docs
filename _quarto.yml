project:
  type: website
  output-dir: _site
  pre-render:
    - Rscript _scripts/extract-rust-docs.R
  render:
    - "*.qmd"
    - "!_scripts/"
    - "!internals/_extracted/"
    # theory drafts stay hidden in _theory/ (Quarto ignores _-prefixed dirs);
    # published theory pages live in theory/

website:
  title: "masgenomics"
  favicon: assets/MBGs.svg
  description: "Genomic prediction with SNP and microhaplotype data using masbayes and masreml"
  site-url: https://bowo1698.github.io/masgenomics-docs/
  repo-url: https://github.com/bowo1698/masgenomics-docs
  repo-actions: [edit, issue]
  page-navigation: true

  navbar:
    background: primary
    pinned: true
    search: true
    logo: assets/MBGs.svg
    logo-alt: "masgenomics logo"
    logo-href: https://bowo1698.github.io/masgenomics-docs/index.html
    title: "masgenomics"
    left:
      - href: index.qmd
        text: Home
      - href: theory/index.qmd
        text: Theory
      - href: installation/index.qmd
        text: Installation
      - href: activities/index.qmd
        text: Activities
      - href: input-data/index.qmd
        text: Input Data
      - text: Reference
        menu:
          - href: reference/maspipeline/index.qmd
            text: maspipeline
          - href: reference/masreml/index.qmd
            text: masreml
          - href: reference/masbayes/index.qmd
            text: masbayes
      - href: internals/index.qmd
        text: Internals
    right:
      - icon: github
        href: https://github.com/bowo1698/masgenomics-docs
        aria-label: GitHub

  sidebar:
    - title: "Theory"
      collapse-level: 1
      contents:
        - theory/index.qmd
        - section: "1. Biological fundamentals"
          contents:
            - theory/biological-fundamentals/genetic-fundamentals.qmd
            - theory/biological-fundamentals/genetic-variation-markers.qmd
            - theory/biological-fundamentals/population-genetic-variation.qmd
            - theory/biological-fundamentals/linkage-recombination-ld.qmd
            - theory/biological-fundamentals/haplotypes-phasing-microhaplotypes.qmd
            - theory/biological-fundamentals/pedigrees-relatedness-inbreeding.qmd
        - section: "2. Mathematical fundamentals"
          contents:
            - theory/mathematical-fundamentals/descriptive-statistics.qmd
            - theory/mathematical-fundamentals/probability-random-variables.qmd
            - theory/mathematical-fundamentals/probability-distributions.qmd
            - theory/mathematical-fundamentals/sampling-uncertainty.qmd
            - theory/mathematical-fundamentals/covariance-correlation.qmd
            - theory/mathematical-fundamentals/vectors-matrices.qmd
            - theory/mathematical-fundamentals/linear-regression.qmd
            - theory/mathematical-fundamentals/multiple-regression-regularisation.qmd
            - theory/mathematical-fundamentals/statistical-models-estimation.qmd
            - theory/mathematical-fundamentals/linear-mixed-models.qmd
        - section: "3. Genomic prediction"
          contents:
            - theory/genomic-prediction/quantitative-genetics.qmd
            - theory/genomic-prediction/markers-to-prediction.qmd
    - title: "Input Data"
      collapse-level: 1
      contents:
        - input-data/index.qmd
        - input-data/snp.qmd
        - input-data/microhaplotypes.qmd
        - input-data/phenotype.qmd
        - input-data/pedigree.qmd
    - title: "Activities"
      collapse-level: 1
      contents:
        - activities/index.qmd
        - section: "Genomic prediction"
          href: activities/genomic-prediction/index.qmd
          contents:
            - text: "Overview"
              href: activities/genomic-prediction/index.qmd
            - activities/genomic-prediction/masreml.qmd
            - activities/genomic-prediction/masbayes.qmd
        - section: "GWAS"
          href: activities/gwas/index.qmd
          contents:
            - text: "Overview"
              href: activities/gwas/index.qmd
            - activities/gwas/masreml.qmd
            - activities/gwas/masbayes.qmd
        - activities/marker-qtl-congruency.qmd
        - activities/forward-prediction.qmd
    - title: "Internals"
      collapse-level: 1
      contents:
        - internals/index.qmd
        - internals/masreml-rust.qmd
        - internals/masbayes-rust.qmd
    - title: "Reference: maspipeline"
      collapse-level: 1
      contents:
        - text: "Overview"
          href: reference/maspipeline/index.qmd
        - reference/maspipeline/data-preparation.qmd
        - reference/maspipeline/phasing.qmd
        - reference/maspipeline/genotype-to-haplotype.qmd
        - reference/maspipeline/microhaplotype-discovery.qmd
    - title: "Reference: masreml"
      collapse-level: 1
      contents:
        - reference/masreml/index.qmd
        - auto: reference/masreml/*.qmd
    - title: "Reference: masbayes"
      collapse-level: 1
      contents:
        - reference/masbayes/index.qmd
        - auto: reference/masbayes/*.qmd

  search:
    location: navbar
    type: overlay
    copy-button: true

  page-footer:
    left: "© 2026 Agus Wibowo · MIT License"
    right:
      - icon: github
        href: https://github.com/bowo1698/masgenomics-docs

format:
  html:
    theme: [superhero, assets/custom.scss]
    toc: true
    toc-depth: 3
    toc-location: right
    code-copy: true
    code-overflow: wrap
    code-link: true
    code-tools: false
    code-fold: true
    highlight-style: github-dark
    fig-cap-location: bottom
    tbl-cap-location: top
    include-after-body: assets/navbar-brand-fix.html
    smooth-scroll: true
    anchor-sections: true
    link-external-newwindow: true
execute:
  freeze: auto
  echo: true
  warning: false
  message: false

bibliography: CITATION.bib
csl: https://www.zotero.org/styles/apa
