project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "!_scripts/"

website:
  title: "masgenomics"
  favicon: assets/MBGs.svg
  description: "Genomic prediction with SNP and microhaplotype data using masbayes and masreml"
  site-url: https://bowo1698.github.io/masgenomics-docs/
  repo-url: https://github.com/bowo1698/masgenomics-docs
  repo-actions: [edit, issue]
  page-navigation: true

  navbar:
    background: primary
    pinned: true
    search: true
    logo: assets/MBGs.svg
    logo-alt: "masgenomics logo"
    logo-href: https://bowo1698.github.io/masgenomics-docs/index.html
    title: "masgenomics"
    left:
      - href: index.qmd
        text: Home
      - href: installation/index.qmd
        text: Installation
      - href: theory/index.qmd
        text: Theory
      - href: tasks/index.qmd
        text: Task
      - href: input-data/index.qmd
        text: Input Data
      - text: Reference
        menu:
          - href: reference/maspipeline/index.qmd
            text: maspipeline
          - href: reference/masreml/index.qmd
            text: masreml
          - href: reference/masbayes/index.qmd
            text: masbayes
      - href: internals/index.qmd
        text: Internals
    right:
      - icon: github
        href: https://github.com/bowo1698/masgenomics-docs
        aria-label: GitHub

  sidebar:
    - title: "Theory"
      style: docked
      collapse-level: 1
      contents:
        - theory/index.qmd
        - section: "From Phenotype to Genome"
          href: theory/from-phenotype-to-genome.qmd
          contents:
            - text: "Overview"
              href: theory/from-phenotype-to-genome.qmd
            - theory/fpg-traditional-and-mas.qmd
            - theory/fpg-genomic-selection.qmd
            - theory/fpg-method-bridge.qmd
            - theory/fpg-livestock-implementation.qmd
            - theory/fpg-future.qmd
        - theory/biallelic-and-multiallelic.qmd
        - section: "Mixed Model & BLUP Family"
          href: theory/mixed-model-blup-family.qmd
          contents:
            - text: "Overview"
              href: theory/mixed-model-blup-family.qmd
            - theory/blup-reml.qmd
            - theory/blup-pblup.qmd
            - theory/blup-gblup.qmd
            - theory/blup-gwablup.qmd
        - section: "Bayesian Alphabet"
          href: theory/bayesian-alphabet.qmd
          contents:
            - text: "Overview"
              href: theory/bayesian-alphabet.qmd
            - theory/bayes-mcmc-em.qmd
            - theory/bayes-bayesa.qmd
            - theory/bayes-bayesr.qmd
        - theory/continuous-and-binary-trait.qmd
    - title: "Input Data"
      collapse-level: 1
      contents:
        - input-data/index.qmd
        - input-data/snp.qmd
        - input-data/microhaplotypes.qmd
        - input-data/phenotype.qmd
        - input-data/pedigree.qmd
    - title: "Tasks"
      collapse-level: 1
      contents:
        - tasks/index.qmd
        - section: "Genomic prediction"
          href: tasks/genomic-prediction/index.qmd
          contents:
            - text: "Overview"
              href: tasks/genomic-prediction/index.qmd
            - tasks/genomic-prediction/masreml.qmd
            - tasks/genomic-prediction/masbayes.qmd
        - section: "GWAS"
          href: tasks/gwas/index.qmd
          contents:
            - text: "Overview"
              href: tasks/gwas/index.qmd
            - tasks/gwas/masreml.qmd
            - tasks/gwas/masbayes.qmd
        - tasks/marker-qtl-congruency.qmd
    - title: "Internals"
      collapse-level: 1
      contents:
        - internals/index.qmd
        - internals/masreml-rust.qmd
        - internals/masbayes-rust.qmd
    - title: "Reference: maspipeline"
      collapse-level: 1
      contents:
        - text: "Overview"
          href: reference/maspipeline/index.qmd
        - reference/maspipeline/data-preparation.qmd
        - reference/maspipeline/phasing.qmd
        - reference/maspipeline/genotype-to-haplotype.qmd
        - reference/maspipeline/microhaplotype-discovery.qmd
    - title: "Reference: masreml"
      collapse-level: 1
      contents:
        - reference/masreml/index.qmd
        - auto: reference/masreml/*.qmd
    - title: "Reference: masbayes"
      collapse-level: 1
      contents:
        - reference/masbayes/index.qmd
        - auto: reference/masbayes/*.qmd

  search:
    location: navbar
    type: overlay
    copy-button: true

  page-footer:
    left: "© 2026 Agus Wibowo · MIT License"
    right:
      - icon: github
        href: https://github.com/bowo1698/masgenomics-docs

format:
  html:
    theme: [superhero, assets/custom.scss]
    toc: true
    toc-depth: 3
    toc-location: right
    code-copy: true
    code-overflow: wrap
    code-link: true
    code-tools: false
    code-fold: false
    highlight-style: github-dark
    fig-cap-location: bottom
    tbl-cap-location: top
    include-after-body: assets/navbar-brand-fix.html
    smooth-scroll: true
    anchor-sections: true
    link-external-newwindow: true
execute:
  freeze: auto
  echo: true
  warning: false
  message: false

bibliography: CITATION.bib
csl: https://www.zotero.org/styles/apa
